services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoszerv
      POSTGRES_PASSWORD: autoszerv
      POSTGRES_DB: autoszerv
    ports:
      - "5432:5432"
    volumes:
      - autoszerv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoszerv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autoszerv_pgdata:
